<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混合搜索演示</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .search-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
        }
        textarea {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 100px;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .search-modes {
            display: flex;
            gap: 10px;
        }
        .search-mode {
            padding: 8px 15px;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-mode.active {
            background-color: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-container {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            min-height: 100px;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .metadata {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>混合搜索演示</h1>
    <p>这个演示展示了不同搜索模式下的结果对比：默认向量检索、BM25关键词检索和混合检索。</p>
    
    <div class="search-container">
        <textarea id="query-input" placeholder="请输入你的问题..."></textarea>
        <div class="controls">
            <div class="search-modes">
                <div class="search-mode active" data-mode="default">默认向量检索</div>
                <div class="search-mode" data-mode="bm25">BM25关键词检索</div>
                <div class="search-mode" data-mode="hybrid">混合检索</div>
            </div>
            <button id="search-btn">搜索</button>
        </div>
    </div>
    
    <div class="result-container" id="result">
        结果将显示在这里...
    </div>
    <div class="metadata" id="metadata"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const queryInput = document.getElementById('query-input');
            const searchBtn = document.getElementById('search-btn');
            const resultContainer = document.getElementById('result');
            const metadataContainer = document.getElementById('metadata');
            const searchModes = document.querySelectorAll('.search-mode');
            
            // 当前选中的搜索模式
            let currentMode = 'default';
            
            // 切换搜索模式
            searchModes.forEach(mode => {
                mode.addEventListener('click', function() {
                    searchModes.forEach(m => m.classList.remove('active'));
                    this.classList.add('active');
                    currentMode = this.dataset.mode;
                });
            });
            
            // 搜索按钮点击事件
            searchBtn.addEventListener('click', function() {
                const query = queryInput.value.trim();
                if (!query) {
                    resultContainer.textContent = '请输入查询内容';
                    return;
                }
                
                // 显示加载状态
                resultContainer.innerHTML = '<div class="loading">搜索中，请稍候...</div>';
                metadataContainer.textContent = '';
                
                // 发送请求
                fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        search_mode: currentMode
                    })
                })
                .then(response => response.json())
                .then(data => {
                    resultContainer.textContent = data.response;
                    const now = new Date();
                    metadataContainer.textContent = `搜索模式: ${currentMode} | 查询时间: ${now.toLocaleTimeString()}`;
                })
                .catch(error => {
                    resultContainer.textContent = `发生错误: ${error.message}`;
                });
            });
            
            // 在文本框中按Enter也可以触发搜索
            queryInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    searchBtn.click();
                }
            });
        });
    </script>
</body>
</html>
