name: record
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core & UI
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296
  flutter_slidable: ^3.1.0

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.2
  equatable: ^2.0.7

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.1

  # Utils
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  permission_handler: ^12.0.0+1
  local_auth: ^2.3.0

  # File & Image
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  go_router: ^14.2.1
  flutter_markdown: ^0.7.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  # image_gallery_saver: ^2.0.3
  share_plus: ^11.0.0
  cross_file: ^0.3.4+2
  logger: ^2.6.0

  extended_text_field: ^11.0.1
  flutter_quill: ^11.4.1
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Build & Codegen - 使用最新版
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

